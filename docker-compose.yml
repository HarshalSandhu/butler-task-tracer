services:
  api:
    build:
      context: ./backend
      network: host
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SQLITE_PATH=/data/task_tracer.db
      # Path only, inside the read-only ~/.ssh mount below - never a key
      # value itself. Explicit so ssh doesn't fall back to trying every
      # default identity file in order (fragile if an earlier one is
      # unreadable/malformed). Change to match whichever key in your
      # ~/.ssh actually has access to the target boxes.
      - SSH_KEY_PATH=/root/.ssh/butler_tracer_ed25519
      # How long ssh waits for a target to respond before giving up.
      - SSH_CONNECT_TIMEOUT_SECONDS=50
    volumes:
      # Read-only bind mount of the operator's own SSH keys - see
      # README.md "SSH access model" and backend/app/ssh/executor.py's
      # module docstring for the invariant this supports (the app never
      # accepts/stores a private key itself; it only shells out to `ssh`,
      # which resolves auth from this mount exactly like a terminal would).
      - ${HOME}/.ssh:/root/.ssh:ro
      - sqlite-data:/data
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      network: host
    command: ["python", "worker_entry.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SQLITE_PATH=/data/task_tracer.db
      # Path only, inside the read-only ~/.ssh mount below - never a key
      # value itself. Explicit so ssh doesn't fall back to trying every
      # default identity file in order (fragile if an earlier one is
      # unreadable/malformed). Change to match whichever key in your
      # ~/.ssh actually has access to the target boxes.
      - SSH_KEY_PATH=/root/.ssh/butler_tracer_ed25519
      # How long ssh waits for a target to respond before giving up.
      - SSH_CONNECT_TIMEOUT_SECONDS=50
    volumes:
      - ${HOME}/.ssh:/root/.ssh:ro
      - sqlite-data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # No persistence needed - job state is ephemeral, results land in
    # SQLite (see PLAN.md "Caching/storage").

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "5175:5175"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - api

volumes:
  sqlite-data:
